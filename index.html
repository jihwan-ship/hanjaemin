<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>쫄라맨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <section id="title" class="screen">
      <h1>쫄라맨</h1>
      <button id="btnStart" type="button">게임시작</button>
      <button id="btnHow" type="button">게임방법</button>
    </section>

    <section id="howto" class="screen" hidden>
      <h2 class="ot">게임방법</h2>
      <p class="ht ot">쫄라맨을 소환해서 눌러보면 됩니다.</p>
      <p class="ht ot g">총 4가지의 엔딩이 존재하며, 그중 히든엔딩이 1가지 있습니다.</p>
      <p class="ht ot r">Tip : 무의식적으로 누르다 보면 엔딩을 볼 수도 있습니다.</p>
      <p class="ht ot r">Tip : 가끔 소리가 납니다. 볼륨 주의.</p>
      <button id="btnBack" type="button">뒤로</button>
    </section>

    <section id="stage" class="screen" hidden>
      <div class="hud ot"><span>누른 횟수 <b id="cnt">0</b> &nbsp; 엔딩 <b id="endcnt">0</b>/4</span><button id="btnMenu" class="mini" type="button">메인으로</button></div>
      <p id="bubble" class="bubble" aria-live="polite"></p>
      <svg id="jjolla" viewBox="0 0 300 400" aria-label="쫄라맨">
        <ellipse id="shadow" cx="150" cy="368" rx="84" ry="8"/>
        <g id="squish">
          <g id="hero">
            <path id="bodyShade" transform="translate(-9 6)" d="M118 162 C114 210 106 254 104 290 L196 290 C194 254 186 210 182 162 Z"/>
            <path id="bodyFill" d="M118 162 C114 210 106 254 104 290 L196 290 C194 254 186 210 182 162 Z"/>
            <path class="stroke" d="M118 162 C114 210 106 254 104 290 L196 290 C194 254 186 210 182 162"/>
            <g id="legL"><path class="stroke" d="M130 292 L120 352 h-28"/></g>
            <g id="legR"><path class="stroke" d="M170 292 L180 352 h28"/></g>
            <g id="armL"><path class="stroke" d="M112 190 Q78 210 66 252"/></g>
            <g id="armR">
              <path class="stroke" d="M188 190 Q224 182 238 148"/>
              <path id="cupFill" d="M222 116 h36 l-5 32 h-26 z"/>
              <path class="stroke" d="M222 116 h36 l-5 32 h-26 z"/>
            </g>
            <path id="headShade" transform="translate(-11 9)" d="M150 30 C205 28 236 66 234 106 C232 146 196 170 150 170 C104 170 66 146 66 104 C66 62 100 32 150 30 Z"/>
            <path id="headFill" d="M150 30 C205 28 236 66 234 106 C232 146 196 170 150 170 C104 170 66 146 66 104 C66 62 100 32 150 30 Z"/>
            <path class="stroke" d="M150 30 C205 28 236 66 234 106 C232 146 196 170 150 170 C104 170 66 146 66 104 C66 62 100 32 150 30 Z"/>
            <g id="face">
              <path class="lid" d="M96 108 L146 104"/>
              <path class="lid" d="M174 104 L224 109"/>
            </g>
          </g>
        </g>
      </svg>
    </section>

    <section id="ending" class="screen" hidden>
      <h2 id="endTitle"></h2>
      <p id="endDesc"></p>
      <button id="btnRetry" type="button">다시하기</button>
    </section>
  </div>

  <div id="scare" aria-hidden="true">
    <canvas id="noise" width="160" height="90"></canvas>
    <svg id="scareFace" viewBox="0 0 300 300">
      <path d="M150 10 C230 6 290 60 288 150 C286 250 220 296 150 294 C76 296 12 246 12 150 C12 60 72 14 150 10 Z" fill="#e8e8e0" stroke="#000" stroke-width="8"/>
      <circle cx="92" cy="112" r="50" fill="#fff" stroke="#000" stroke-width="6"/>
      <circle cx="210" cy="118" r="62" fill="#fff" stroke="#000" stroke-width="6"/>
      <circle cx="96" cy="114" r="6" fill="#000"/>
      <circle cx="206" cy="120" r="7" fill="#000"/>
      <path d="M40 60 L120 86 M180 50 Q220 30 270 62" stroke="#000" stroke-width="12" stroke-linecap="round" fill="none"/>
      <path d="M40 210 Q150 300 262 200 Q150 250 40 210 Z" fill="#000"/>
      <path d="M56 212 L70 236 L84 222 L100 246 L116 230 L134 252 L150 234 L168 252 L186 232 L204 248 L220 226 L238 234 L252 208" fill="#e8e8e0" stroke="#000" stroke-width="3"/>
      <path d="M210 40 C222 90 196 110 212 160 M120 4 C112 40 126 60 118 80" stroke="#b00000" stroke-width="10" fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <script src="script.js"></script>
</body>
</html>
